<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Toplantı Odası Rezervasyon</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="text-align: center; margin-bottom: 1rem;">
          <img src="https://files.tuseb.gov.tr/tuseb/images/ayarlar/2025-03-17-sk1JhgvXvo4x24MR6wmX.png"
            alt="TÜSEB Logo" style="max-width: 170px; height: auto;">
        </div>
        <h1>Toplantı Odaları Rezervasyon Giriş</h1>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" class="form-control" placeholder="Kullanıcı adınızı girin" required
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" class="form-control" placeholder="Şifrenizi girin" required
            autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Giriş Yap
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8;">
        <!-- <p>Yönetici Girişi: <code style="color: #3b82f6;">admin</code> / <code style="color: #3b82f6;">admin123</code></p> -->
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in, redirect to index
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.loggedIn) {
          window.location.href = '/index.html';
        }
      });

    const form = document.getElementById('login-form');
    const alertContainer = document.getElementById('alert-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Clear alerts
      alertContainer.innerHTML = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Giriş yapılamadı.');
        }

        // Redirect to main page
        window.location.href = '/index.html';
      } catch (err) {
        alertContainer.innerHTML = `
          <div class="alert-box alert-danger" style="margin-top: 10px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>${err.message}</span>
          </div>
        `;
      }
    });
  </script>
</body>

</html>
