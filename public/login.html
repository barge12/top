<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Toplantı Odası Rezervasyon</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="text-align: center; margin-bottom: 1rem;">
          <img src="https://files.tuseb.gov.tr/tuseb/images/ayarlar/2025-03-17-sk1JhgvXvo4x24MR6wmX.png"
            alt="TÜSEB Logo" style="max-width: 170px; height: auto;">
        </div>
        <h1>Toplantı Odaları Rezervasyon Giriş</h1>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" class="form-control" placeholder="Kullanıcı adınızı girin" required
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" class="form-control" placeholder="Şifrenizi girin" required
            autocomplete="current-password" oncopy="return false;" onpaste="return false;" oncut="return false;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Giriş Yap
        </button>
      </form>

      <form id="reset-password-form" style="display: none;">
        <div style="margin-bottom: 1rem; color: #4292d6; font-size: 0.9rem; font-weight: 500; text-align: center;">
          Lütfen hesabınız için yeni bir şifre belirleyin.
        </div>
        <div class="form-group">
          <label for="new-password">Yeni Şifre</label>
          <input type="password" id="new-password" class="form-control" placeholder="En az 6 karakter girin" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Şifreyi Değiştir ve Devam Et
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8;">
        <!-- <p>Yönetici Girişi: <code style="color: #3b82f6;">admin</code> / <code style="color: #3b82f6;">admin123</code></p> -->
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in, redirect to index
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.loggedIn) {
          window.location.href = '/index.html';
        }
      });

    const form = document.getElementById('login-form');
    const resetForm = document.getElementById('reset-password-form');
    const alertContainer = document.getElementById('alert-container');

    let tempUsername = '';
    let tempOldPassword = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      alertContainer.innerHTML = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Giriş yapılamadı.');
        }

        if (data.requirePasswordChange) {
          tempUsername = username;
          tempOldPassword = password;
          form.style.display = 'none';
          resetForm.style.display = 'block';
          alertContainer.innerHTML = `
            <div class="alert-box alert-success" style="margin-top: 10px;">
              <i class="fa-solid fa-circle-check"></i>
              <span>Geçici şifreyle giriş başarılı, lütfen şifrenizi yenileyin.</span>
            </div>
          `;
          return;
        }

        window.location.href = '/index.html';
      } catch (err) {
        alertContainer.innerHTML = `
          <div class="alert-box alert-danger" style="margin-top: 10px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>${err.message}</span>
          </div>
        `;
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      
      alertContainer.innerHTML = '';
      
      if (newPassword.length < 6) {
        alertContainer.innerHTML = `
          <div class="alert-box alert-danger" style="margin-top: 10px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Yeni şifre en az 6 karakter olmalıdır.</span>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-forced-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: tempUsername, 
            oldPassword: tempOldPassword, 
            newPassword 
          })
        });

        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Şifre güncellenemedi.');
        }

        // Success, switch back to login to re-authenticate with new password
        resetForm.style.display = 'none';
        form.style.display = 'block';
        document.getElementById('password').value = '';
        tempUsername = '';
        tempOldPassword = '';
        
        alertContainer.innerHTML = `
          <div class="alert-box alert-success" style="margin-top: 10px;">
            <i class="fa-solid fa-circle-check"></i>
            <span>${data.message}</span>
          </div>
        `;
      } catch (err) {
        alertContainer.innerHTML = `
          <div class="alert-box alert-danger" style="margin-top: 10px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>${err.message}</span>
          </div>
        `;
      }
    });
  </script>
</body>

</html>
